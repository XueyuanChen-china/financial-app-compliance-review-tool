name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

  compliance-integration:
    name: Compliance integration path
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run compliance review integration tests
        run: >-
          pytest
          tests/test_phase1_phase2_phase3_runtime_e2e.py
          tests/test_full_review.py
          tests/test_diff_review.py
